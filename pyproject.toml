[project]
name = "ohv-analytics-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=17",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "faker>=30",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "sqlfluff>=3.2",
  "sqlfluff-templater-dbt>=3.2",
  "dbt-core>=1.9",
  "dbt-postgres>=1.9",
]

[tool.setuptools.packages.find]
include = ["synth*", "loader*"]